<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易Wiki</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 920px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.7;
        }
        nav {
            background: #f4f5f7;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        a, .wiki-link {
            color: #2563eb;
            cursor: pointer;
            text-decoration: none;
        }
        a:hover, .wiki-link:hover {
            text-decoration: underline;
        }
        button, .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-danger {
            background-color: #dc2626;
        }
        textarea {
            width: 100%;
            min-height: 420px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin: 10px 0;
        }
        .page-view {
            padding: 10px;
        }
        .msg {
            padding: 8px 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 6px;
            margin:10px 0;
        }
        .new-page-form {
            margin-top:20px;
            padding-top:15px;
            border-top:1px solid #ddd;
        }
        input {
            padding:6px 8px;
            border:1px solid #ccc;
            border-radius:4px;
        }
        ul {
            padding-left: 2rem;
            margin: 0.5rem 0;
        }
        h1,h2,h3 {
            margin:1rem 0 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <a class="btn" onclick="openPage('Home')">🏠 首页</a>
        <button onclick="editPage(currentPage)">✏️ 编辑</button>
        <button class="btn-danger" onclick="deletePage(currentPage)">🗑 删除</button>
        <span id="page-title" style="font-weight:bold; margin-left:10px;"></span>
    </nav>

    <div id="message"></div>

    <div id="view-area" class="page-view"></div>
    <div id="edit-area" style="display:none;">
        <h3>编辑页面</h3>
        <textarea id="editor"></textarea>
        <br>
        <button onclick="savePage()">💾 保存</button>
        <button onclick="openPage(currentPage)">取消</button>
    </div>

    <div class="new-page-form">
        <h4>新建页面</h4>
        <input type="text" id="new-page-name" placeholder="输入页面名称">
        <button onclick="createNewPage()">新建</button>
    </div>

<script>
// 当前打开的页面
let currentPage = "Home";

// 初始化：如果本地没有wiki数据，初始化Home页面
if(!localStorage.getItem("wikiData")){
    const initData = {
        "Home": "# 欢迎来到简易Wiki\n\n这是纯前端Wiki网站，数据保存在浏览器本地存储。\n\n## 使用说明\n- 点击【编辑】修改内容\n- 使用 `[链接文字](页面名)` 创建Wiki内部跳转\n- 示例：[关于](About)\n\n- 加粗：**文字**\n- 斜体：*文字*\n- 列表：\n- 项目1\n- 项目2"
    }
    localStorage.setItem("wikiData", JSON.stringify(initData));
}

// 获取全部wiki页面数据
function getWiki(){
    return JSON.parse(localStorage.getItem("wikiData"));
}
function saveWiki(data){
    localStorage.setItem("wikiData", JSON.stringify(data));
}

// Markdown简易解析器（支持标题、加粗、斜体、列表、wiki内部链接）
function renderMarkdown(md){
    let html = md
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/^# (.*)$/gm, "<h1>$1</h1>")
        .replace(/^## (.*)$/gm, "<h2>$1</h2>")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        // wiki内部链接 [文字](页面名)
        .replace(/\[(.+?)\]\((.+?)\)/g, `<span class="wiki-link" onclick="openPage('$2')">$1</span>`)
        .replace(/^- (.*)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>)(\s*<li>)/g, "$1$2")
        .replace(/((<li>.+<\/li>)(\s*<li>.+<\/li>)+)/g, "<ul>$1</ul>")
        .replace(/\n/g,"<br>");
    return html;
}

// 打开页面
function openPage(pageName){
    currentPage = pageName;
    const wiki = getWiki();
    document.getElementById("page-title").innerText = "页面：" + pageName;
    document.getElementById("edit-area").style.display = "none";
    document.getElementById("view-area").style.display = "block";

    let content;
    if(wiki[pageName]){
        content = wiki[pageName];
    }else{
        content = `# ${pageName}\n\n页面不存在，点击编辑创建。`;
    }
    document.getElementById("view-area").innerHTML = renderMarkdown(content);
    document.getElementById("message").innerText = "";
}

// 进入编辑模式
function editPage(pageName){
    const wiki = getWiki();
    document.getElementById("view-area").style.display = "none";
    document.getElementById("edit-area").style.display = "block";
    let content = wiki[pageName] || `# ${pageName}\n\n在这里写页面内容...`;
    document.getElementById("editor").value = content;
}

// 保存页面
function savePage(){
    const wiki = getWiki();
    wiki[currentPage] = document.getElementById("editor").value;
    saveWiki(wiki);
    showMsg("页面保存成功！");
    openPage(currentPage);
}

// 删除页面
function deletePage(pageName){
    if(pageName === "Home"){
        showMsg("不能删除首页Home！");
        return;
    }
    if(!confirm(`确定删除页面「${pageName}」？`)) return;
    const wiki = getWiki();
    delete wiki[pageName];
    saveWiki(wiki);
    showMsg("页面已删除");
    openPage("Home");
}

// 新建页面
function createNewPage(){
    const name = document.getElementById("new-page-name").value.trim();
    if(!name) {alert("请输入页面名称");return;}
    document.getElementById("new-page-name").value = "";
    openPage(name);
    editPage(name);
}

function showMsg(text){
    document.getElementById("message").innerHTML = `<div class="msg">${text}</div>`;
}

// 页面加载默认打开Home
openPage("Home");
</script>
</body>
</html>
