<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中考倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border-radius: 26px;
            padding: 50px 36px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 620px;
            width: 100%;
        }
        h1 {
            font-size: 38px;
            margin-bottom: 14px;
            letter-spacing: 4px;
        }
        .subtitle {
            font-size: 17px;
            opacity: 0.88;
            margin-bottom: 42px;
        }
        .count-box {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .item {
            background: rgba(255,255,255,0.16);
            border-radius: 18px;
            padding: 26px 18px;
            min-width: 105px;
        }
        .num {
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .label {
            font-size: 15px;
            opacity: 0.82;
        }
        .quote-wrap {
            margin-top: 45px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quote {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.95;
            transition: opacity 0.6s ease;
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }
            .num {
                font-size: 38px;
            }
            .item {
                min-width: 80px;
                padding: 18px 12px;
            }
            .quote {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>中考倒计时</h1>
        <div class="subtitle">AI制作，真的</div>
        <div class="count-box">
            <div class="item">
                <div class="num" id="day">00</div>
                <div class="label">天</div>
            </div>
            <div class="item">
                <div class="num" id="hour">00</div>
                <div class="label">时</div>
            </div>
            <div class="item">
                <div class="num" id="min">00</div>
                <div class="label">分</div>
            </div>
            <div class="item">
                <div class="num" id="sec">00</div>
                <div class="label">秒</div>
            </div>
        </div>
        <div class="quote-wrap">
            <div class="quote" id="quote-text"></div>
        </div>
    </div>

    <script>
        const examDate = new Date('2027-06-21 00:00:00');

        const quotes = [
            "星光不问赶路人，时光不负有心人。",
            "每一份努力，都在悄悄为你铺路。",
            "熬过万丈孤独，藏下星辰大海。",
            "现在的汗水，是未来惊喜的伏笔。",
            "全力以赴，你会很酷。",
            "前路浩浩荡荡，万事尽可期待。",
            "提笔征战四方，合笔如愿以偿。",
            "追风赶月莫停留，平芜尽处是春山。",
            "那些默默努力的日子，终会发光。",
            "慢慢来，谁不是翻山越岭去成长。",
            "不必焦虑，你走的每一步都算数。",
            "心有所期，全力以赴，定有所成。",
            "少年自有玫瑰与星光，愿你乘风破浪。",
            "关关难过关关过，前路漫漫亦灿灿。",
            "埋首蓄力，顶峰相见。"
        ];

        let lastMinute = -1;
        let quoteIndex = 0;
        const quoteEl = document.getElementById('quote-text');

  
        function updateCount() {
            const now = new Date();
            const diff = examDate - now;

            if (diff <= 0) {
                document.getElementById('day').innerText = '00';
                document.getElementById('hour').innerText = '00';
                document.getElementById('min').innerText = '00';
                document.getElementById('sec').innerText = '00';
                quoteEl.innerText = "中考加油，旗开得胜！";
                return;
            }

            const day = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hour = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const min = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const sec = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('day').innerText = String(day).padStart(2, '0');
            document.getElementById('hour').innerText = String(hour).padStart(2, '0');
            document.getElementById('min').innerText = String(min).padStart(2, '0');
            document.getElementById('sec').innerText = String(sec).padStart(2, '0');

            // 每分钟切换一句话
            const currentMinute = now.getMinutes();
            if (currentMinute !== lastMinute) {
                lastMinute = currentMinute;
                changeQuote();
            }
        }

        // 切换语录，带淡入效果
        function changeQuote() {
            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteEl.innerText = quotes[quoteIndex];
                quoteEl.style.opacity = 1;
            }, 600);
        }

        // 初始化
        quoteEl.innerText = quotes[0];
        quoteEl.style.opacity = 1;
        updateCount();
        setInterval(updateCount, 1000);
    </script>
</body>
</html>
