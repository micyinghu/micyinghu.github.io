<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Space - Minecraft服务器Wiki</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #121416;
            color: #e2e2e2;
            font-family: "Segoe UI", system-ui, sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.86), rgba(0,0,0,0.86)), url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23283440' fill-opacity='0.25'%3E%3Cpath d='M0 0h32v32H0V0zm32 32h32v32H32V32z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background-color: #1b2026;
            border-right: 3px solid #303a44;
            padding: 22px 16px;
        }
        .sidebar h2 {
            color: #71cfff;
            font-size:21px;
            margin-bottom:18px;
            border-bottom: 2px solid #2b5b80;
            padding-bottom:8px;
        }
        .sidebar-item {
            display:block;
            color:#c2d0dd;
            text-decoration:none;
            padding:8px 6px;
            border-left:3px solid transparent;
            cursor:pointer;
            margin:3px 0;
        }
        .sidebar-item:hover {
            background:#272f38;
            color:#96d9ff;
            border-left:3px solid #71cfff;
        }
        .sidebar-block{
            margin-top:24px;
        }
        .sidebar-block h4{
            color:#a0b4c8;
            margin-bottom:8px;
        }
        /* 主内容区域 */
        .main {
            flex:1;
            padding:26px;
            max-width: 1050px;
        }
        .header-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#1e252d;
            padding:14px 20px;
            border:2px solid #303a44;
            border-radius:5px;
            margin-bottom:22px;
            flex-wrap:wrap;
            gap:12px;
        }
        .header-title{
            color:#71cfff;
            font-size:26px;
            font-weight:bold;
        }
        .status-tag{
            padding:4px 10px;
            border-radius:3px;
            font-size:13px;
            margin-right:8px;
        }
        .status-normal{
            background:#244036;
            color:#76e8b4;
        }
        .status-admin{
            background:#403224;
            color:#ffc871;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 3px;
            background-color:#2b6fa8;
            color:white;
            cursor:pointer;
            font-weight:bold;
            border:2px solid #1d4b72;
        }
        .btn:disabled{
            background:#333840;
            border-color:#22262b;
            opacity:0.45;
            cursor:not-allowed;
        }
        .btn:hover:not(:disabled){
            background:#3486cc;
        }
        .btn-danger{
            background:#943838;
            border-color:#642424;
        }
        .btn-danger:hover:not(:disabled){
            background:#b44545;
        }
        .btn-gray{
            background:#3c4652;
            border-color:#282f38;
        }
        .btn-gray:hover{
            background:#4c5866;
        }
        /* 密码弹窗 */
        .modal-wrap{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.88);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box{
            background:#1b2026;
            border:3px solid #71cfff;
            padding:30px;
            width:360px;
            border-radius:6px;
        }
        .modal-box h3{
            color:#71cfff;
            margin-bottom:20px;
            text-align:center;
            font-size:23px;
        }
        .modal-box input{
            width:100%;
            padding:10px;
            margin:8px 0;
            background:#121416;
            border:2px solid #303a44;
            color:#fff;
            font-size:15px;
        }
        .modal-box input:focus{
            border-color:#71cfff;
            outline:none;
        }
        .modal-buttons{
            margin-top:16px;
            display:flex;
            gap:10px;
        }
        .modal-desc{
            margin-top:14px;
            color:#99a8b8;
            font-size:13px;
            text-align:center;
        }
        /* 编辑区域 */
        textarea{
            width:100%;
            min-height:440px;
            background:#121416;
            color:#e2e2e2;
            border:2px solid #303a44;
            padding:14px;
            font-family:monospace;
            font-size:14px;
        }
        .view-area h1{
            color:#71cfff;
            margin:14px 0;
            border-bottom:2px solid #272f38;
            padding-bottom:10px;
        }
        .view-area h2{
            color:#96d9ff;
            margin:12px 0;
        }
        .view-area h3{
            color:#b7e6ff;
            margin:10px 0;
        }
        .view-area ul{
            padding-left:30px;
            margin:12px 0;
        }
        .view-area strong{
            color:#ffffff;
        }
        .wiki-link{
            color:#71cfff;
            cursor:pointer;
            text-decoration:underline;
        }
        .wiki-link:hover{
            color:#b7e6ff;
        }
        .msg{
            background:#203848;
            color:#96d9ff;
            padding:11px;
            border:1px solid #2b6fa8;
            margin:14px 0;
            border-radius:4px;
        }
        .msg-error{
            background:#402222;
            color:#ff9c9c;
            border:1px solid #943838;
        }
        .hidden{
            display:none !important;
        }
    </style>
</head>
<body>
    <!-- 管理模式密码弹窗 -->
    <div id="adminModal" class="modal-wrap hidden">
        <div class="modal-box">
            <h3>🔐 进入管理模式</h3>
            <input id="adminPassword" type="text" placeholder="输入管理密码">
            <div class="modal-buttons">
                <button class="btn" onclick="checkAdminPassword()">确认</button>
                <button class="btn btn-gray" onclick="closeAdminModal()">取消</button>
            </div>
            <div class="modal-desc">密码正确后解锁页面编辑、新建、删除功能</div>
        </div>
    </div>

    <div class="container">
        <!-- 侧边导航 -->
        <aside class="sidebar">
            <h2>🌌 Air Space Wiki</h2>
            <div class="sidebar-item" onclick="openPage('服务器首页')">🏠 服务器首页</div>
            <div class="sidebar-item" onclick="openPage('服务器介绍')">📖 服务器介绍</div>
            <div class="sidebar-item" onclick="openPage('服务器规则')">📜 服务器规则</div>
            <div class="sidebar-item" onclick="openPage('模组列表')">📦 模组列表</div>
            <div class="sidebar-item" onclick="openPage('主城')">🏰 主城</div>
            <div class="sidebar-item" onclick="openPage('玩家领地')">🗺 玩家领地</div>
            <div class="sidebar-item" onclick="openPage('常用指令')">⌨ 常用指令</div>
            <div class="sidebar-item" onclick="showAllPages()">📋 所有Wiki页面</div>

            <div class="sidebar-block">
                <h4>新建页面</h4>
                <input style="width:100%;padding:6px;background:#121416;color:#fff;border:1px solid #303a44;" id="newPageName" placeholder="页面名称">
                <button class="btn" style="width:100%;margin-top:8px;" onclick="createNewPage()" id="btnNewPage">新建页面</button>
            </div>
            <div class="sidebar-block">
                <h4>数据备份</h4>
                <button class="btn btn-gray" style="width:100%;margin-top:5px;" onclick="exportWiki()">导出备份</button>
                <button class="btn btn-gray" style="width:100%;margin-top:5px;" onclick="importWiki()">导入备份</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main">
            <div class="header-bar">
                <div>
                    <span class="header-title" id="pageTitle">Air Space 服务器Wiki</span>
                    <span class="status-tag status-normal" id="modeStatus">浏览模式</span>
                </div>
                <div>
                    <button class="btn" onclick="requestAdminMode()">🔐管理模式</button>
                    <button class="btn" onclick="editPage(currentPage)" id="btnEdit">✏️编辑</button>
                    <button class="btn btn-danger" onclick="deletePage(currentPage)" id="btnDel">🗑删除</button>
                    <button class="btn btn-gray" onclick="exitAdminMode()" id="btnExitAdmin">退出管理</button>
                </div>
            </div>

            <div id="messageBox"></div>

            <!-- 阅读区域 -->
            <div id="viewArea" class="view-area"></div>
            <!-- 编辑区域 -->
            <div id="editArea" class="hidden">
                <h3 style="color:#71cfff;">编辑Wiki页面</h3>
                <textarea id="editor"></textarea>
                <br>
                <button class="btn" onclick="savePage()">💾保存页面</button>
                <button class="btn btn-gray" onclick="openPage(currentPage)">取消</button>
            </div>
        </main>
    </div>

<script>
    let currentPage = "服务器首页";
    const ADMIN_PASSWORD = "120117_wzmX";
    let isAdminMode = false;

    // 初始化本地Wiki数据
    function initStorage(){
        if(!localStorage.getItem("airspaceWikiData")){
            const defaultWiki = {
                "服务器首页":`# 🌌 Air Space 服务器 Wiki
欢迎来到 Air Space Minecraft 服务器维基！

> Air Space 是一个生存向MC服务器，包含专属模组与领地系统。

## 快速导航
- [服务器介绍](服务器介绍)
- [服务器规则](服务器规则)
- [模组列表](模组列表)
- [主城](主城)
- [玩家领地](玩家领地)
- [常用指令](常用指令)

> 普通访客只能浏览页面；进入管理模式后可编辑所有Wiki内容。
内部链接写法：\`[文字](页面名)\`
Markdown语法支持：#标题、**加粗**、*斜体*、-无序列表`,

                "服务器介绍":`# 服务器介绍
## Air Space
- 版本：Minecraft 1.20.1（模组服）
- 类型：多人生存，领地保护，休闲冒险
- 特色：自定义主城、资源世界、维度探索

服务器定期重置资源世界，主世界长期保留玩家建筑。`,

                "服务器规则":`# 服务器规则
1. 禁止破坏他人领地内建筑、偷取物品。
2. 禁止使用作弊客户端、外挂、透视模组。
3. 禁止恶意刷屏、辱骂、引战。
4. 禁止大规模机器造成服务器卡顿。
5. 违规会依次给予警告、封禁。`,

                "模组列表":`# 模组列表
## 核心模组
- 领地保护模组
- 小地图模组
- 装备耐久显示
- 背包整理
> 所有客户端模组需要在群内下载，不要自行添加额外作弊模组`,

                "主城":`# 主城
Air Space主城为出生点区域，提供基础传送、商店、公告板。
- 禁止在主城私自建造建筑
- 主城提供基础物资领取点
- 主城可传送至资源世界`,

                "玩家领地":`# 玩家领地
领地用于保护玩家建筑，防止他人破坏。
- 使用领地指令圈地
- 领地内可以设置好友权限
- 领地超出范围需要额外购买`,

                "常用指令":`# 常用指令
- /help 查看帮助
- /claim 圈领地
- /trust 给予好友领地权限
- /home 设置家
- /spawn 返回主城
- /tpa 传送请求`
            };
            localStorage.setItem("airspaceWikiData", JSON.stringify(defaultWiki));
        }
    }

    // 读写Wiki数据
    function getWiki(){return JSON.parse(localStorage.getItem("airspaceWikiData"));}
    function saveWiki(data){localStorage.setItem("airspaceWikiData", JSON.stringify(data));}

    // Markdown渲染
    function renderMD(md){
        let html = md
            .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/^# (.*)$/gm, "<h1>$1</h1>")
            .replace(/^## (.*)$/gm, "<h2>$1</h2>")
            .replace(/^### (.*)$/gm, "<h3>$1</h3>")
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.+?)\*/g, "<em>$1</em>")
            .replace(/\[(.+?)\]\((.+?)\)/g, `<span class="wiki-link" onclick="openPage('$2')">$1</span>`)
            .replace(/^- (.*)$/gm, "<li>$1</li>")
            .replace(/(<li>.*<\/li>)(\s*<li>)/g, "$1$2")
            .replace(/((<li>.+<\/li>)(\s*<li>.+<\/li>)+)/g, "<ul>$1</ul>")
            .replace(/\n/g,"<br>");
        return html;
    }

    // 打开页面
    function openPage(pageName){
        currentPage = pageName;
        document.getElementById("pageTitle").innerText = pageName;
        document.getElementById("viewArea").classList.remove("hidden");
        document.getElementById("editArea").classList.add("hidden");
        document.getElementById("messageBox").innerHTML = "";

        const wiki = getWiki();
        const content = wiki[pageName] || `# ${pageName}\n\n该页面暂未创建，进入管理模式后编辑创建。`;
        document.getElementById("viewArea").innerHTML = renderMD(content);
    }

    // 管理模式密码校验
    function requestAdminMode(){
        if(isAdminMode){
            showMsg("✅你已经处于管理模式");
            return;
        }
        document.getElementById("adminModal").classList.remove("hidden");
        document.getElementById("adminPassword").value = "";
    }
    function closeAdminModal(){
        document.getElementById("adminModal").classList.add("hidden");
    }
    function checkAdminPassword(){
        const inputPwd = document.getElementById("adminPassword").value.trim();
        if(inputPwd === ADMIN_PASSWORD){
            isAdminMode = true;
            updateAdminUI();
            closeAdminModal();
            showMsg("✅成功进入管理模式，可编辑Wiki页面");
        }else{
            showMsg("❌密码错误，无法进入管理模式","msg-error");
        }
    }
    function exitAdminMode(){
        isAdminMode = false;
        updateAdminUI();
        showMsg("🔒已退出管理模式，编辑功能已锁定");
    }
    function updateAdminUI(){
        document.getElementById("btnEdit").disabled = !isAdminMode;
        document.getElementById("btnDel").disabled = !isAdminMode;
        document.getElementById("btnNewPage").disabled = !isAdminMode;
        const statusEl = document.getElementById("modeStatus");
        if(isAdminMode){
            statusEl.className = "status-tag status-admin";
            statusEl.innerText = "管理模式";
        }else{
            statusEl.className = "status-tag status-normal";
            statusEl.innerText = "浏览模式";
        }
    }

    // 编辑 / 保存 / 删除
    function editPage(){
        if(!isAdminMode) return;
        const wiki = getWiki();
        document.getElementById("viewArea").classList.add("hidden");
        document.getElementById("editArea").classList.remove("hidden");
        const content = wiki[currentPage] || `# ${currentPage}\n\n在这里编写Air Space服务器Wiki内容`;
        document.getElementById("editor").value = content;
    }
    function savePage(){
        const wiki = getWiki();
        wiki[currentPage] = document.getElementById("editor").value;
        saveWiki(wiki);
        showMsg("✅页面保存成功");
        openPage(currentPage);
    }
    function deletePage(){
        if(currentPage === "服务器首页"){alert("不能删除服务器首页！");return;}
        if(!confirm(`确定删除页面【${currentPage}】？`)) return;
        const wiki = getWiki();
        delete wiki[currentPage];
        saveWiki(wiki);
        showMsg("🗑页面已删除");
        openPage("服务器首页");
    }
    function createNewPage(){
        if(!isAdminMode) return;
        const name = document.getElementById("newPageName").value.trim();
        if(!name) return;
        document.getElementById("newPageName").value = "";
        openPage(name);
        editPage();
    }

    // 列出全部页面
    function showAllPages(){
        const wiki = getWiki();
        let listHtml = "<h1>所有Wiki页面</h1><ul>";
        Object.keys(wiki).forEach(p=>{
            listHtml += `<li><span class="wiki-link" onclick="openPage('${p}')">${p}</span></li>`;
        })
        listHtml += "</ul>";
        document.getElementById("viewArea").innerHTML = listHtml;
        document.getElementById("editArea").classList.add("hidden");
    }

    // 备份导出导入
    function exportWiki(){
        const wikiData = getWiki();
        const jsonStr = JSON.stringify(wikiData,null,2);
        const blob = new Blob([jsonStr], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "airspace_wiki_backup.json";
        a.click();
        URL.revokeObjectURL(url);
        showMsg("💾备份文件下载完成");
    }
    function importWiki(){
        const input = document.createElement("input");
        input.type="file";
        input.accept=".json";
        input.onchange = (e)=>{
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev){
                try{
                    const data = JSON.parse(ev.target.result);
                    localStorage.setItem("airspaceWikiData",JSON.stringify(data));
                    showMsg("✅导入成功，页面已刷新");
                    openPage("服务器首页");
                }catch(err){
                    showMsg("❌文件解析失败，请确认是备份json文件","msg-error");
                }
            }
            reader.readAsText(file);
        }
        input.click();
    }

    function showMsg(text, cls="msg"){
        document.getElementById("messageBox").innerHTML = `<div class="${cls}">${text}</div>`;
    }

    // 初始化启动
    initStorage();
    updateAdminUI();
    openPage("服务器首页");
</script>
</body>
</html>
