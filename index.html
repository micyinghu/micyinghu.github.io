<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 中文 Wiki</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #171717;
            color: #e6e6e6;
            font-family: "Segoe UI", sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.88)), url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23333333' fill-opacity='0.3'%3E%3Cpath d='M0 0h32v32H0V0zm32 32h32v32H32V32z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        /*侧边栏*/
        .sidebar {
            width: 240px;
            background-color: #222222;
            border-right: 3px solid #444;
            padding: 20px 14px;
        }
        .sidebar h2 {
            color: #60c859;
            font-size:20px;
            margin-bottom:16px;
            border-bottom: 2px solid #3a7836;
            padding-bottom:8px;
        }
        .sidebar a {
            display:block;
            color:#cccccc;
            text-decoration:none;
            padding:7px 4px;
            border-left:3px solid transparent;
            cursor:pointer;
        }
        .sidebar a:hover {
            background:#333;
            color:#89e883;
            border-left:3px solid #60c859;
        }
        .page-list{
            margin-top:15px;
        }
        /*主区域*/
        .main {
            flex:1;
            padding:24px;
            max-width: 1000px;
        }
        .header-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#292929;
            padding:12px 18px;
            border:2px solid #444;
            border-radius:4px;
            margin-bottom:20px;
            flex-wrap:wrap;
            gap:10px;
        }
        .header-title{
            color:#60c859;
            font-size:24px;
            font-weight:bold;
        }
        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 2px;
            background-color:#478b41;
            color:white;
            cursor:pointer;
            font-weight:bold;
            border:2px solid #2d5c29;
        }
        .btn:disabled{
            background:#444;
            border-color:#222;
            cursor:not-allowed;
            opacity:0.5;
        }
        .btn:hover:not(:disabled){
            background:#59a852;
        }
        .btn-danger{
            background:#9c3434;
            border-color:#632020;
        }
        .btn-danger:hover:not(:disabled){
            background:#b84242;
        }
        .btn-gray{
            background:#555;
            border-color:#333;
        }
        .btn-gray:hover{
            background:#666;
        }
        /*密码弹窗*/
        .modal-wrap{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box{
            background:#222;
            border:3px solid #60c859;
            padding:28px;
            width:340px;
            border-radius:4px;
        }
        .modal-box h3{
            color:#60c859;
            margin-bottom:18px;
            text-align:center;
            font-size:22px;
        }
        .modal-box input{
            width:100%;
            padding:9px;
            margin:8px 0;
            background:#111;
            border:2px solid #444;
            color:#fff;
        }
        .modal-box input:focus{
            border-color:#60c859;
            outline:none;
        }
        .modal-buttons{
            margin-top:14px;
            display:flex;
            gap:8px;
        }
        /*编辑区*/
        textarea{
            width:100%;
            min-height:420px;
            background:#111;
            color:#eee;
            border:2px solid #444;
            padding:12px;
            font-family:monospace;
            font-size:14px;
        }
        .view-area h1{
            color:#60c859;
            margin:12px 0;
            border-bottom:2px solid #333;
            padding-bottom:8px;
        }
        .view-area h2{
            color:#92e88c;
            margin:10px 0;
        }
        .view-area h3{
            color:#b0f0ab;
            margin:8px 0;
        }
        .view-area ul{
            padding-left:28px;
            margin:10px 0;
        }
        .view-area strong{
            color:#fff;
        }
        .wiki-link{
            color:#72d66c;
            cursor:pointer;
            text-decoration:underline;
        }
        .wiki-link:hover{
            color:#b4ffae;
        }
        .msg{
            background:#244722;
            color:#89e883;
            padding:10px;
            border:1px solid #478b41;
            margin:12px 0;
        }
        .msg-error{
            background:#472222;
            color:#ff9494;
            border:1px solid #8b4141;
        }
        .hidden{
            display:none !important;
        }
        .newpage-row{
            margin-top:20px;
            padding-top:16px;
            border-top:1px solid #444;
        }
        .backup-area{
            margin-top:12px;
        }
    </style>
</head>
<body>
    <!-- 密码弹窗 -->
    <div id="pwdModal" class="modal-wrap hidden">
        <div class="modal-box">
            <h3>编辑权限验证</h3>
            <input id="editPassword" type="text" placeholder="输入编辑密码">
            <div class="modal-buttons">
                <button class="btn" onclick="checkPassword()">确认解锁编辑</button>
                <button class="btn btn-gray" onclick="closePwdModal()">取消</button>
            </div>
            <p style="margin-top:12px; color:#aaa;font-size:13px;">密码正确后才能编辑、新建、删除页面</p>
        </div>
    </div>

    <div class="container">
        <!-- 侧边导航 -->
        <aside class="sidebar">
            <h2>📖 MC Wiki</h2>
            <a onclick="openPage('首页')">🏠 首页</a>
            <a onclick="openPage('方块')">🟩 方块</a>
            <a onclick="openPage('生物')">👾 生物</a>
            <a onclick="openPage('物品')">📦 物品</a>
            <a onclick="openPage('附魔')">✨ 附魔</a>
            <a onclick="showAllPages()">📜 所有页面</a>

            <div class="page-list">
                <h4 style="margin-top:20px; color:#aaa;">新建页面</h4>
                <input style="width:100%;padding:5px;background:#111;color:white;border:1px solid #444;" id="newPageName" placeholder="页面名称">
                <button class="btn" style="width:100%;margin-top:6px;" onclick="createNewPage()" id="btnNewPage">新建</button>
            </div>
            <div class="backup-area">
                <h4 style="margin-top:20px;color:#aaa;">数据备份</h4>
                <button class="btn btn-gray" style="width:100%;margin-top:4px;" onclick="exportWiki()">导出备份</button>
                <button class="btn btn-gray" style="width:100%;margin-top:4px;" onclick="importWiki()">导入备份</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main">
            <div class="header-bar">
                <div class="header-title" id="pageTitle">Minecraft Wiki</div>
                <div>
                    <button class="btn" onclick="requestEdit()" id="btnEdit">✏️编辑</button>
                    <button class="btn btn-danger" onclick="deletePage(currentPage)" id="btnDel">🗑删除</button>
                    <button class="btn btn-gray" onclick="lockEdit()">🔒锁定编辑</button>
                </div>
            </div>

            <div id="messageBox"></div>

            <!-- 阅读区域 -->
            <div id="viewArea" class="view-area"></div>
            <!-- 编辑区域 -->
            <div id="editArea" class="hidden">
                <h3 style="color:#60c859;">编辑页面</h3>
                <textarea id="editor"></textarea>
                <br>
                <button class="btn" onclick="savePage()">💾保存页面</button>
                <button class="btn btn-gray" onclick="openPage(currentPage)">取消</button>
            </div>
        </main>
    </div>

<script>
    let currentPage = "首页";
    const EDIT_PASSWORD = "120117_wzmX";
    let editUnlocked = false;

    //初始化本地存储
    function initStorage(){
        if(!localStorage.getItem("mcWikiData")){
            const defaultWiki = {
                "首页":`# Minecraft Wiki
欢迎来到我的世界中文维基！

> 静态本地版Wiki，内容保存在浏览器本地存储。

## 分类导航
- [方块](方块)
- [生物](生物)
- [物品](物品)
- [附魔](附魔)

## 编辑说明
点击右上角编辑按钮，输入密码解锁编辑权限
内部页面链接写法：\`[链接文字](页面名)\`
Markdown支持：#标题，**加粗**，*斜体*，-列表`,
                "方块":`# 方块
## 草方块
Minecraft最基础的自然方块，草原生物群系大量生成。
- 锄头右键可以转为耕地
- 黑暗环境会生成怪物

## 石头
地下大量生成，可烧制为石头，合成工具。`,
                "生物":`# 生物
## 僵尸
敌对亡灵生物，黑暗处生成，会攻击玩家。
- 可以拾取地上装备
- 阳光照射会燃烧

## 苦力怕
潜行爆炸，没有声音预警，靠近玩家引爆。`,
                "物品":`# 物品
## 钻石
珍贵矿石，地下深层生成，制作钻石装备、工具。
## 铁锭
冶炼铁矿石获得，基础装备原料。`,
                "附魔":`# 附魔
## 时运
采集方块增加掉落数量，镐、铲、斧可用。
## 效率
加快挖掘方块速度。
## 保护
减少受到的全部伤害。`
            };
            localStorage.setItem("mcWikiData", JSON.stringify(defaultWiki));
        }
    }

    //Wiki数据读写
    function getWiki(){return JSON.parse(localStorage.getItem("mcWikiData"));}
    function saveWiki(data){localStorage.setItem("mcWikiData", JSON.stringify(data));}

    //Markdown渲染
    function renderMD(md){
        let html = md
            .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/^# (.*)$/gm, "<h1>$1</h1>")
            .replace(/^## (.*)$/gm, "<h2>$1</h2>")
            .replace(/^### (.*)$/gm, "<h3>$1</h3>")
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.+?)\*/g, "<em>$1</em>")
            .replace(/\[(.+?)\]\((.+?)\)/g, `<span class="wiki-link" onclick="openPage('$2')">$1</span>`)
            .replace(/^- (.*)$/gm, "<li>$1</li>")
            .replace(/(<li>.*<\/li>)(\s*<li>)/g, "$1$2")
            .replace(/((<li>.+<\/li>)(\s*<li>.+<\/li>)+)/g, "<ul>$1</ul>")
            .replace(/\n/g,"<br>");
        return html;
    }

    //页面跳转
    function openPage(pageName){
        currentPage = pageName;
        document.getElementById("pageTitle").innerText = pageName;
        document.getElementById("viewArea").classList.remove("hidden");
        document.getElementById("editArea").classList.add("hidden");
        document.getElementById("messageBox").innerHTML = "";

        const wiki = getWiki();
        const content = wiki[pageName] || `# ${pageName}\n\n页面不存在，解锁编辑后创建页面。`;
        document.getElementById("viewArea").innerHTML = renderMD(content);
    }

    //密码相关
    function requestEdit(){
        if(editUnlocked){
            editPage();
        }else{
            document.getElementById("pwdModal").classList.remove("hidden");
            document.getElementById("editPassword").value="";
        }
    }
    function closePwdModal(){
        document.getElementById("pwdModal").classList.add("hidden");
    }
    function checkPassword(){
        const inputPwd = document.getElementById("editPassword").value.trim();
        if(inputPwd === EDIT_PASSWORD){
            editUnlocked = true;
            updateEditButtons();
            closePwdModal();
            showMsg("✅编辑权限已解锁，可以编辑/新建/删除页面");
            editPage();
        }else{
            showMsg("❌密码错误，无法解锁编辑权限","msg-error");
        }
    }
    function lockEdit(){
        editUnlocked = false;
        updateEditButtons();
        showMsg("🔒编辑权限已锁定");
    }
    function updateEditButtons(){
        document.getElementById("btnEdit").disabled = !editUnlocked;
        document.getElementById("btnDel").disabled = !editUnlocked;
        document.getElementById("btnNewPage").disabled = !editUnlocked;
    }

    //编辑保存删除
    function editPage(){
        const wiki = getWiki();
        document.getElementById("viewArea").classList.add("hidden");
        document.getElementById("editArea").classList.remove("hidden");
        const content = wiki[currentPage] || `# ${currentPage}\n\n在这里编写MC维基内容...`;
        document.getElementById("editor").value = content;
    }
    function savePage(){
        const wiki = getWiki();
        wiki[currentPage] = document.getElementById("editor").value;
        saveWiki(wiki);
        showMsg("✅页面保存成功");
        openPage(currentPage);
    }
    function deletePage(){
        if(currentPage === "首页"){alert("不能删除首页");return;}
        if(!confirm(`确定删除页面【${currentPage}】？`)) return;
        const wiki = getWiki();
        delete wiki[currentPage];
        saveWiki(wiki);
        showMsg("🗑页面已删除");
        openPage("首页");
    }
    function createNewPage(){
        const name = document.getElementById("newPageName").value.trim();
        if(!name) return;
        document.getElementById("newPageName").value = "";
        openPage(name);
        editPage();
    }

    //页面列表
    function showAllPages(){
        const wiki = getWiki();
        let listHtml = "<h1>所有Wiki页面</h1><ul>";
        Object.keys(wiki).forEach(p=>{
            listHtml += `<li><span class="wiki-link" onclick="openPage('${p}')">${p}</span></li>`;
        })
        listHtml += "</ul>";
        document.getElementById("viewArea").innerHTML = listHtml;
        document.getElementById("editArea").classList.add("hidden");
    }

    //备份导出导入
    function exportWiki(){
        const wikiData = getWiki();
        const jsonStr = JSON.stringify(wikiData,null,2);
        const blob = new Blob([jsonStr], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "mcwiki_backup.json";
        a.click();
        URL.revokeObjectURL(url);
        showMsg("💾备份文件已下载");
    }
    function importWiki(){
        const input = document.createElement("input");
        input.type="file";
        input.accept=".json";
        input.onchange = (e)=>{
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev){
                try{
                    const data = JSON.parse(ev.target.result);
                    localStorage.setItem("mcWikiData",JSON.stringify(data));
                    showMsg("✅导入成功，刷新页面");
                    openPage("首页");
                }catch(err){
                    showMsg("❌文件解析失败","msg-error");
                }
            }
            reader.readAsText(file);
        }
        input.click();
    }

    function showMsg(text, cls="msg"){
        document.getElementById("messageBox").innerHTML = `<div class="${cls}">${text}</div>`;
    }

    //启动
    initStorage();
    updateEditButtons();
    openPage("首页");
</script>
</body>
</html>
